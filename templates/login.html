<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in | MGwix SemanticIR Studio</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <main class="main-content">
    <div class="dashboard-wrapper auth-wrapper">
      <div class="panel auth-panel">
        <h1 class="page-title">SemanticIR Studio</h1>
        <p class="page-sub">Enter your access password to continue.</p>
        {% if error %}
          <p class="auth-error" role="alert">{{ error }}</p>
        {% endif %}
        <form method="post" action="{{ url_for('login') }}">
          <div class="form-group">
            <label for="password">Access password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
          </div>
          <button type="submit" class="btn-primary-glow">Sign in</button>
        </form>
      </div>
    </div>
  </main>
</body>
</html>
