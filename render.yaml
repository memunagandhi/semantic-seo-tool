services:
  - type: web
    name: mgwix-semantic-ir-tool
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: mgwix-semantic-db
          property: connectionString
      - key: COHERE_API_KEY
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: "true"

databases:
  - name: mgwix-semantic-db
    plan: free
